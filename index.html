<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صباح الخير يا نونه</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F8F1EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap">

<style>
  /* ---- One committed visual world: a pearl-blush dawn, champagne rules,
         carmine accent borrowed from the ∞ jersey in the photos. ---- */
  :root{
    --ground:      #F8F1EE;
    --ground-2:    #EFE1DB;
    --ground-deep: #E6D3CC;
    --ink:         #2D1F24;
    --muted:       #7E6468;
    --accent:      #A83244;
    --accent-soft: #C9757F;
    --line:        #E0CEC5;
    --gold:        #C0A183;
    --shadow: 0 2px 6px rgba(45,31,36,.05), 0 18px 46px -12px rgba(45,31,36,.26);
    color-scheme: light;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Tajawal", "Segoe UI", system-ui, sans-serif;
    direction: rtl;
    text-align: center;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
  }

  /* soft dawn wash behind everything */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 70% at 50% -10%, #FDF8F6 0%, rgba(253,248,246,0) 62%),
      radial-gradient(90% 55% at 50% 108%, var(--ground-deep) 0%, rgba(230,211,204,0) 68%);
    pointer-events: none;
    z-index: 0;
  }

  #petals{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .page{
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin-inline: auto;
    padding-inline: 22px;
    padding-block: 34px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  /* ---------- masthead ---------- */
  .stamp{
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .16em;
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .stamp i{
    display: block;
    width: 34px;
    height: 1px;
    background: var(--line);
  }

  h1{
    font-family: "Aref Ruqaa", "Segoe UI", serif;
    font-weight: 700;
    font-size: clamp(34px, 10.4vw, 50px);
    line-height: 1.5;
    margin: 0;
    text-wrap: balance;
    color: var(--ink);
  }

  h1 .pet{
    display: block;
    font-size: .72em;
    line-height: 1.6;
    color: var(--accent);
  }

  .lede{
    margin: -12px 0 0;
    max-width: 30ch;
    color: var(--muted);
    font-size: 15.5px;
    font-weight: 400;
    line-height: 1.85;
  }

  /* ---------- the film ---------- */
  .film{
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .frame{
    position: relative;
    width: 100%;
    max-width: 330px;
    aspect-ratio: 9 / 16;
    max-height: 68dvh;
    border-radius: 22px;
    overflow: hidden;
    background: var(--ground-2);
    box-shadow: var(--shadow);
    cursor: pointer;
    border: 0;
    padding: 0;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  /* champagne hairline that sits above the video */
  .frame::after{
    content:"";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    border: 1px solid rgba(192,161,131,.55);
    pointer-events: none;
  }
  .frame:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  video{
    width: 100%;
    height: 100%;
    max-width: 100%;
    object-fit: cover;
    display: block;
  }

  .veil{
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, rgba(45,31,36,.12) 0%, rgba(45,31,36,.30) 100%);
    transition: opacity .45s ease;
  }
  .veil[hidden]{ display: none !important; }

  .play{
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: rgba(255,252,251,.94);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px -8px rgba(45,31,36,.5);
  }
  .play svg{ margin-inline-start: 4px; }

  .hint{
    position: absolute;
    inset-inline: 0;
    bottom: 22px;
    color: rgba(255,252,251,.95);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
    text-shadow: 0 1px 6px rgba(45,31,36,.6);
  }

  .track{
    width: 100%;
    max-width: 330px;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .track span{
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s linear;
  }

  /* shown only if playback actually fails */
  .escape{
    display: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration-color: var(--line);
    text-underline-offset: 4px;
  }
  .escape.on{ display: block; }

  /* ---------- credits ---------- */
  .credit{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 400;
  }
  .credit b{
    color: var(--ink);
    font-weight: 500;
  }
  .credit svg{ flex: none; }

  .note{
    margin: 0;
    max-width: 28ch;
    color: var(--ink);
    font-size: 16px;
    font-weight: 400;
    line-height: 2;
  }

  .seal{
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .seal .rule{
    width: 44px;
    height: 1px;
    background: var(--line);
  }
  .seal .inf{
    font-family: "Tajawal", system-ui, sans-serif;
    font-size: 26px;
    line-height: 1;
    color: var(--accent);
  }
  .seal .cap{
    font-family: "Aref Ruqaa", serif;
    font-size: 19px;
    color: var(--ink);
  }
  .seal .date{
    font-size: 11.5px;
    letter-spacing: .22em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<main class="page">

  <div class="stamp"><i></i>23 · 07 · 2026<i></i></div>

  <h1>صباح الخير<br><span class="pet">يا نونه حموود كتكووته</span></h1>

  <p class="lede">فنجان القهوة يستنى شوية… ده أحلى يوم في حياتنا، اتلمّ كله في أربعين ثانية.</p>

  <div class="film">
    <div class="frame" id="frame" role="button" tabindex="0" aria-label="تشغيل الفيديو">
      <video id="v" poster="poster.jpg" playsinline webkit-playsinline
             preload="metadata" disablepictureinpicture
             x5-playsinline="true" x5-video-player-type="h5">
        <source src="film.mp4" type="video/mp4">
      </video>
      <div class="veil" id="veil">
        <div class="play" aria-hidden="true">
          <svg width="26" height="30" viewBox="0 0 26 30" fill="none">
            <path d="M25 13.27a2 2 0 0 1 0 3.46L3 29.46A2 2 0 0 1 0 27.73V2.27A2 2 0 0 1 3 .54l22 12.73Z" fill="#A83244"/>
          </svg>
        </div>
        <div class="hint">اضغطي وارفعي الصوت 🎧</div>
      </div>
    </div>
    <div class="track" aria-hidden="true"><span id="bar"></span></div>
    <a class="escape" id="escape" href="film.mp4">الفيديو مش راضي يشتغل؟ افتحيه من هنا</a>
  </div>

  <div class="credit">
    <svg width="14" height="16" viewBox="0 0 14 16" fill="none" aria-hidden="true">
      <path d="M13 1 4.5 2.9v8.7a2.6 2.6 0 1 0 1.2 2.2V6.1L11.8 4.7v5.1a2.6 2.6 0 1 0 1.2 2.2V1Z" fill="#A83244"/>
    </svg>
    <span>من أغنية <b>«آه يا حلو»</b> — آدم زين الدين</span>
  </div>

  <p class="note">كل صورة فيهم حاجة، وإنتي أحلى حاجة فيهم كلهم.</p>

  <div class="seal">
    <span class="rule"></span>
    <span class="inf">∞</span>
    <span class="cap">صفقة العمر</span>
    <span class="date">23 . 7 . 2026</span>
  </div>

</main>

<script>
(function(){
  var v = document.getElementById('v');
  var frame = document.getElementById('frame');
  var veil = document.getElementById('veil');
  var bar = document.getElementById('bar');

  var escape = document.getElementById('escape');

  function fallback(){
    /* playback refused or errored: hand over to the native player */
    v.controls = true;
    veil.hidden = true;
    escape.classList.add('on');
  }

  function toggle(){
    if (v.paused) {
      v.muted = false;
      v.volume = 1;
      var p = v.play();
      if (p && p.then) {
        p.then(function(){
          veil.hidden = true;
        }).catch(function(){
          /* some browsers refuse audio on the first gesture — retry muted,
             then let the viewer unmute with the native controls */
          v.muted = true;
          var q = v.play();
          if (q && q.then) q.then(function(){
            veil.hidden = true;
            v.controls = true;
          }).catch(fallback);
          else fallback();
        });
      } else {
        veil.hidden = true;
      }
      frame.setAttribute('aria-label', 'إيقاف مؤقت');
    } else {
      v.pause();
      veil.hidden = false;
      frame.setAttribute('aria-label', 'تشغيل الفيديو');
    }
  }

  frame.addEventListener('click', toggle);
  frame.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  v.addEventListener('error', fallback);

  v.addEventListener('timeupdate', function(){
    if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%';
  });

  v.addEventListener('ended', function(){
    veil.hidden = false;
    frame.setAttribute('aria-label', 'إعادة التشغيل');
    bar.style.width = '100%';
  });

  /* --- ambient rose petals, echoing the confetti shots --- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('petals');
  if (!reduce && c.getContext) {
    var ctx = c.getContext('2d');
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var tints = ['rgba(200,110,126,', 'rgba(224,168,176,', 'rgba(192,161,131,'];
    var petals = [];

    function size(){
      W = c.clientWidth; H = c.clientHeight;
      c.width = W * dpr; c.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function seed(){
      petals = [];
      var n = Math.max(10, Math.min(20, Math.round(W / 34)));
      for (var i = 0; i < n; i++) {
        petals.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 3.4 + Math.random() * 4.2,
          sp: 0.16 + Math.random() * 0.34,
          sw: 0.5 + Math.random() * 1.1,
          ph: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI,
          dr: (Math.random() - 0.5) * 0.008,
          a: 0.16 + Math.random() * 0.2,
          t: tints[(Math.random() * tints.length) | 0]
        });
      }
    }

    function draw(){
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < petals.length; i++) {
        var p = petals[i];
        p.y += p.sp;
        p.ph += 0.008;
        p.rot += p.dr;
        p.x += Math.sin(p.ph) * p.sw * 0.28;
        if (p.y - p.r > H) { p.y = -p.r * 2; p.x = Math.random() * W; }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.t + p.a + ')';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r, p.r * 0.56, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(draw);
    }

    size(); seed(); draw();
    window.addEventListener('resize', function(){ size(); seed(); });
  }
})();
</script>
</body>
</html>
